[project]
name = "oracle"
version = "2.0.0"
description = "An AI Dungeon Master that runs a real-time tabletop RPG session - server-authoritative engine, web client."
requires-python = ">=3.11"
dependencies = [
    "websockets>=13.0",
    "anthropic>=0.34",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]
ollama = ["ollama>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["shared", "server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
