[project]
name = "oracle"
version = "0.1.0"
description = "An AI Dungeon Master that runs a real-time tabletop RPG session over a terminal UI."
requires-python = ">=3.11"
dependencies = [
    "textual>=0.58",
    "websockets>=13.0",
    "anthropic>=0.34",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]
ollama = ["ollama>=0.6"]
web = ["textual-serve>=1.1"]

[project.scripts]
oracle-serve-web = "client.serve_web:main"

[tool.hatch.build.targets.wheel]
packages = ["shared", "server", "client"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
